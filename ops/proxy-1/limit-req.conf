# Rate-limit zone for the Groq proxy.
# Drop in /etc/nginx/conf.d/limit-req.conf (loaded at http{} scope).
#
# Key: $binary_remote_addr → per-IP limit
# 10m zone holds ~160k unique IPs
# rate=1r/s → 1 request per second sustained; burst is configured per-location
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=1r/s;

# Optional: reduce request size — Groq prompts shouldn't be huge.
client_max_body_size 64k;
